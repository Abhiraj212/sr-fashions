<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password — Admin — SR Fashions</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <main class="admin-main" style="max-width:28rem;">
      <h1>Change Password</h1>
      <p class="subtitle">You'll need to sign in again after changing it.</p>

      <form id="password-form" class="mt-8">
        <div class="field"><label for="current">Current password</label><input id="current" type="password" required autocomplete="current-password" /></div>
        <div class="field"><label for="new1">New password</label><input id="new1" type="password" required minlength="8" autocomplete="new-password" /></div>
        <div class="field"><label for="new2">Confirm new password</label><input id="new2" type="password" required minlength="8" autocomplete="new-password" /></div>
        <div id="error" class="field" style="display:none;"><span class="error-text"></span></div>
        <button type="submit" class="btn btn-primary" style="width:100%;"><span id="submit-text">Update password</span></button>
      </form>
    </main>
  </div>

  <script type="module" src="/js/pages/admin-password.js"></script>
</body>
</html>
