<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Admin — SR Fashions</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>
    <main class="admin-main">
      <h1>Gallery</h1>
      <p class="subtitle">Photos shown on the homepage preview and the full gallery page.</p>

      <div class="card mt-8"><div class="card-body">
        <h3 style="font-size:1.125rem;">Add a photo</h3>
        <form id="add-form" class="mt-4">
          <div class="grid-2">
            <div class="field"><label for="new-title">Title</label><input id="new-title" required /></div>
            <div class="field">
              <label for="new-category">Category</label>
              <select id="new-category">
                <option value="bridal">Bridal</option>
                <option value="party-wear">Party Wear</option>
                <option value="designer">Designer</option>
                <option value="custom-stitching">Custom Stitching</option>
              </select>
            </div>
          </div>
          <div class="field"><label for="new-file">Photo</label><input id="new-file" type="file" accept="image/*" required /></div>
          <button type="submit" class="btn btn-primary"><span id="add-btn-text">Upload</span></button>
        </form>
      </div></div>

      <div id="gallery-list" class="mt-8"></div>
    </main>
  </div>

  <script type="module" src="/js/pages/admin-gallery.js"></script>
</body>
</html>
