<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — SR Fashions | Seema Boutique</title>
  <meta name="description" content="Get in touch with Seema Boutique in Hamirpur to book a consultation." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="section">
      <div class="container">
        <p class="eyebrow">Get in touch</p>
        <h2>Contact us</h2>
        <span class="stitch"></span>

        <div class="grid-2 mt-10">
          <div class="card">
            <div class="card-body">
              <h3 style="font-size:1.125rem;">Visit or call</h3>
              <p id="address" class="mt-2 text-muted"></p>
              <p id="hours" class="mt-4 text-muted"></p>
              <p id="phones" class="mt-4"></p>
              <p id="email" class="mt-1"></p>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <h3 style="font-size:1.125rem;">Send an inquiry</h3>
              <form id="contact-form" class="mt-4">
                <div class="field">
                  <label for="name">Name</label>
                  <input id="name" required />
                </div>
                <div class="field">
                  <label for="phone">Phone</label>
                  <input id="phone" type="tel" required />
                </div>
                <div class="field">
                  <label for="message">What are you looking for?</label>
                  <textarea id="message" rows="4" required></textarea>
                </div>
                <div id="form-status" class="field" style="display:none;"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;">
                  <span id="submit-text">Send inquiry</span>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="floating-buttons"></div>

  <script type="module" src="/js/pwa.js"></script>
  <script type="module" src="/js/pages/contact.js"></script>
</body>
</html>
