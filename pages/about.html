<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="/manifest.webmanifest" />

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

<body>

  <main>

      <div class="container" style="max-width:44rem;">
        <p class="eyebrow">Questions</p>
        <h2>Frequently asked questions</h2>
        <span class="stitch"></span>
        <div id="faq-list" class="mt-10"></div>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="floating-buttons"></div>

  <script type="module" src="/js/pwa.js"></script>
  <script type="module" src="/js/pages/about.js"></script>
